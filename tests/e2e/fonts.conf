<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Feste Systemschrift für die Browser-Tests: tests/test_e2e.py setzt FONTCONFIG_FILE auf diese Datei,
     außer FONTCONFIG_FILE ist schon gesetzt. Ohne sie hinge das Ergebnis der Layout-Prüfungen (320/360/390 px
     ohne seitliches Überlaufen) davon ab, welche Schriften auf dem Rechner bzw. Runner liegen: app.css nutzt
     system-ui, eigene Schriften lädt die App nicht. DejaVu Sans läuft breiter als Inter oder Liberation Sans
     und zeigt so den ungünstigen Fall. Braucht das Paket fonts-dejavu-core, die CI installiert und prüft es. -->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>sans</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
